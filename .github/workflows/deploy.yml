name: Build and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy BharatCare AI
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Deploy to EC2 using SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "=============================="
            echo "Starting BharatCare Deployment"
            echo "=============================="

            # Go to project folder
            cd /home/ubuntu/bharatcare-ai

            # Pull latest code
            git pull origin main

            # Build latest Docker image
            docker build -t bharatcare-ai:latest .

            # Stop old container if running
            if [ "$(docker ps -aq -f name=bharatcare-app)" ]; then
              echo "Removing old container..."
              docker rm -f bharatcare-app
            fi

            # Start new container
            docker run -d \
              --name bharatcare-app \
              --restart unless-stopped \
              --env-file backend/.env \
              -p 5000:5000 \
              bharatcare-ai:latest

            # Remove unused Docker images
            docker image prune -f

            echo "=============================="
            echo "Deployment Successful"
            echo "=============================="