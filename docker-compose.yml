version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - bharatcare_data:/app/backend/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_local_dev_only_change_in_prod}

volumes:
  bharatcare_data:
