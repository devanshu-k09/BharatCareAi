<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BharatCare AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-container">
    <div class="auth-box glass-card" data-aos="zoom-in" data-aos-duration="800">
      <div class="text-center mb-4">
        <i class="fa-solid fa-user-plus fa-3x text-primary mb-3"></i>
        <h2 class="fw-bold">Create Account</h2>
        <p class="text-muted">Join BharatCare AI platform</p>
      </div>
      
      <form id="register-form">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
          </div>
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
          Create Account
        </button>
      </form>
      
      <div class="text-center mt-4">
        <span class="text-muted">Already have an account?</span>
        <a href="login.html" class="text-primary text-decoration-none fw-semibold">Login here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
