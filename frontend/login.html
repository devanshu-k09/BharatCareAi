<script>
        // Password Toggle Logic
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle eye icon
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submission and Backend Integration
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                    btn.classList.replace('bg-primary-container', 'bg-green-600');
                    
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    btn.innerHTML = '<span class="material-symbols-outlined">error</span> ' + (data.message || 'Login Failed');
                    btn.classList.replace('bg-primary-container', 'bg-red-600');
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalContent;
                        btn.classList.replace('bg-red-600', 'bg-primary-container');
                    }, 2000);
                }
            } catch (error) {
                console.error("Login error:", error);
                btn.innerHTML = '<span class="material-symbols-outlined">error</span> Network Error';
                btn.classList.replace('bg-primary-container', 'bg-red-600');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-red-600', 'bg-primary-container');
                }, 2000);
            }
        });

        // Interactive focus animations
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-outline', 'text-primary');
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.querySelector('.material-symbols-outlined').classList.replace('text-primary', 'text-outline');
                }
            });
        });
    </script>
