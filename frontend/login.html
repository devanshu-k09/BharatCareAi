<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | BharatCare AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            z-index: 10;
        }
        .divider {
            position: relative;
            margin: var(--spacing-xl) 0;
            text-align: center;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px solid var(--border);
            z-index: 0;
        }
        .divider span {
            background-color: var(--surface);
            padding: 0 var(--spacing-md);
            position: relative;
            z-index: 1;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-create-account {
            background-color: #ffffff;
            color: #1E40AF;
            border: 2px solid #1E40AF;
            font-weight: 600;
            height: 48px;
            padding: 0 1.5rem;
            box-sizing: border-box;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
        }
        .btn-create-account:hover {
            background-color: #1E40AF;
            color: #ffffff;
            border-color: #1E40AF;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25);
        }
        @media (max-width: 480px) {
            .login-wrapper { padding: var(--spacing-sm); }
            .login-card h1 { font-size: 1.75rem !important; }
        }
    </style>
    <script src="js/auth.js"></script>
</head>
<body>
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-blob primary"></div>
        <div class="ambient-blob secondary"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header Section -->
            <div class="text-center mb-xl animate-slide-up">
                <div class="d-flex align-center justify-center mb-md mx-auto">
                    <div class="bg-primary d-flex align-center justify-center rounded-lg" style="width: 56px; height: 56px;">
                        <span class="material-symbols-outlined text-white" style="font-size: 32px;">gavel</span>
                    </div>
                </div>
                <h1 class="text-primary m-0" style="font-size: 2rem;">Welcome Back</h1>
                <p class="mt-xs">Sign in to access your Citizen Help Platform dashboard.</p>
            </div>

            <!-- Login Card -->
            <div class="card card-body animate-slide-up stagger-1">
                <form action="#" method="POST" id="loginForm">
                    <!-- Email Field -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-group">
                            <div class="input-icon">
                                <span class="material-symbols-outlined icon-indicator">mail</span>
                            </div>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required/>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group mt-md">
                        <div class="d-flex justify-between align-center">
                            <label class="form-label" for="password">Password</label>
                            <a href="#" style="font-size: 0.875rem;">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <div class="input-icon">
                                <span class="material-symbols-outlined icon-indicator">lock</span>
                            </div>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required/>
                            <button type="button" class="btn-icon" id="togglePassword" style="margin-right: var(--spacing-sm);">
                                <span class="material-symbols-outlined" id="eyeIcon">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="d-flex align-center gap-sm mt-md">
                        <input type="checkbox" id="remember" name="remember" style="width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;"/>
                        <label for="remember" style="font-size: 0.875rem; color: var(--text-secondary); cursor: pointer;">Remember me for 30 days</label>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="btn btn-primary btn-block mt-lg" id="submitBtn">
                        Sign In
                        <span class="material-symbols-outlined" style="font-size: 1.25rem;">arrow_forward</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Create New Account Button -->
                <a href="register.html" class="btn btn-create-account btn-block" id="createAccountBtn">
                    <span class="material-symbols-outlined" style="font-size: 1.25rem;">person_add</span>
                    Create New Account
                </a>
            </div>

            <!-- Legal -->
            <div class="text-center d-flex justify-center align-center gap-sm mt-lg">
                <a href="#" style="font-size: 0.75rem; color: var(--text-muted);">Privacy Policy</a>
                <span style="font-size: 0.75rem; color: var(--text-muted);">•</span>
                <a href="#" style="font-size: 0.75rem; color: var(--text-muted);">Terms of Service</a>
            </div>
        </div>
    </div>

    <!-- Dynamic Toast Container -->
    <div id="toast-container"></div>

    <script>
        const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:5000' : '';

        // Password Toggle Logic
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'check_circle' : 'error';
            toast.innerHTML = `<span class="material-symbols-outlined">${icon}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Form Submission and Backend Integration
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">progress_activity</span> Authenticating...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                    btn.style.background = 'var(--success)';
                    
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data));
                    
                    showToast('Login successful!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    btn.innerHTML = '<span class="material-symbols-outlined">error</span> Failed';
                    btn.style.background = 'var(--error)';
                    showToast(data.message || 'Login Failed', 'error');
                    
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalContent;
                        btn.style.background = ''; // reset to CSS variable
                    }, 2000);
                }
            } catch (error) {
                console.error("Login error:", error);
                btn.innerHTML = '<span class="material-symbols-outlined">error</span> Error';
                btn.style.background = 'var(--error)';
                showToast('Network Error', 'error');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.style.background = '';
                }, 2000);
            }
        });

        // Add a simple spin animation inline if not in style.css
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
